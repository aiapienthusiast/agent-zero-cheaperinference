# Cheaper Inference provider for Agent Zero.
# Provider ID 'cheaperinference' maps to API_KEY_CHEAPERINFERENCE
# or CHEAPERINFERENCE_API_KEY.
#
# The gateway has no embeddings endpoint, so the plugin adds a chat provider only.
chat:
  cheaperinference:
    name: Cheaper Inference
    litellm_provider: openai
    models_list:
      endpoint_url: "https://api.cheaperinference.com/v1/models"
    kwargs:
      a0_api_mode: chat
      api_base: https://api.cheaperinference.com/v1
